<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kablo Kanalı Hesabı</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e2e5ea;--ac:#0a66d6;--cx:#d93a2f;--cm:#2b2f36;--b7:#c9ccd1;--b14:#9aa0a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eef0f3;--mut:#9aa3b2;--bd:#2c313a;--ac:#4c9aff;--cm:#8b93a1;--b7:#5a6068;--b14:#80868f}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eef0f3;--mut:#9aa3b2;--bd:#2c313a;--ac:#4c9aff;--cm:#8b93a1;--b7:#5a6068;--b14:#80868f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.row+.row{border-top:1px solid var(--bd)}
.row label{flex:1}
.row small{display:block;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:6px}
button{font:inherit;color:var(--tx)}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:20px}
input[type=number],input[type=text]{height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;text-align:center;padding:0 6px}
input[type=number]{width:72px}
input[type=text]{width:100%;text-align:left;padding:0 10px}
.res{background:var(--ac);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.res .big{font-size:34px;font-weight:700}
.res .sub{opacity:.9;font-size:14px}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.line+.line{border-top:1px solid var(--bd)}
.diag{overflow-x:auto}
#bar{min-width:560px}
.lvl{font-size:12px;color:var(--mut);margin:4px 0;text-align:center}
.bar{display:flex;height:46px;margin:0 auto 6px;border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
.bar div{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.seq{white-space:pre-line;font-size:12px;color:var(--mut);margin-top:10px;word-break:break-word}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-weight:600}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.sv{display:flex;gap:8px;margin-bottom:8px}
.sv .btn{flex:0 0 auto;min-width:90px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.item span{flex:1;word-break:break-word}
.item small{color:var(--mut);display:block}
.item button{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
[hidden]{display:none!important}
#setpanel{border-top:1px solid var(--bd);margin-top:10px;padding-top:4px}
#abpanel{border-top:1px solid var(--bd);border-left:3px solid var(--ac);padding-left:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .btn{flex:0 0 auto;min-width:80px;height:36px}
select{height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;padding:0 6px;max-width:190px}
.x{height:34px;width:34px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);margin-left:6px}
#addpanel,#ordpanel{border-top:1px solid var(--bd);border-left:3px solid var(--ac);padding-left:10px}
.empty{color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Kablo Kanalı Hesabı</h1><button class="btn noprint" id="reset">Sıfırla</button></div>

<div class="card noprint">
<h2>Kablolar</h2>
<div class="row"><label>Kat düzeni<small>Çift katta: XLPE devreleri (OG) altta, diğer kablolar ve aboneler (AG) üstte</small></label><select id="kat"><option value="1">Tek kat</option><option value="2">Çift kat</option></select></div>
<div id="cables"></div>
<div class="row" id="addhead" style="cursor:pointer"><label>Kendi kablonu ekle</label><b id="addarr">▾</b></div>
<div id="addpanel" hidden>
<div class="row"><label>Kablo adı</label><input type="text" id="cn" placeholder="Örn. 3x120" style="width:150px"></div>
<div class="row"><label>Dış çap (cm)</label><input type="number" id="cd" step="0.1" value="5"></div>
<div class="row"><label>Tip</label><select id="ct"><option value="0">Çok damarlı (tek tek)</option><option value="1">Tek damar (3'lü devre)</option></select></div>
<div class="row"><button class="btn p" id="cadd">Listeye ekle</button></div>
</div>
</div>

<div class="card noprint">
<div class="row" id="ordhead" style="cursor:pointer;padding:0"><label><span style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)">Kablo sırası</span><small id="ordsum"></small></label><b id="ordarr">▾</b></div>
<div id="ordpanel" hidden></div>
</div>

<div class="res">
<div class="sub" id="pname">Kanal genişliği</div>
<div class="big" id="total">–</div>
<div class="sub" id="sum"></div>
</div>

<div class="card">
<h2>Detay</h2>
<div class="line"><span>Kablo adedi</span><b id="rN"></b></div>
<div class="line"><span>Kablo toplamı</span><b id="rC"></b></div>
<div class="line"><span id="rBl">Takoz + ayırıcı</span><b id="rB"></b></div>
<div class="line"><span>Kenar boşlukları</span><b id="rM"></b></div>
<div id="rLv"></div>
</div>

<div class="card">
<h2>Diziliş</h2>
<div class="diag"><div id="bar"></div></div>
<div class="leg">
<span><i style="background:var(--cx)"></i>Devre kabloları (tek damar)</span><span><i style="background:var(--cm)"></i>Çok damarlı</span><span><i style="background:var(--b7)"></i>Takoz</span><span><i style="background:var(--b14)"></i>Devre ayırıcı</span><span><i style="background:var(--ac)"></i>Abone</span>
</div>
<div class="seq" id="seq"></div>
</div>

<div class="card noprint">
<h2>Çıktı</h2>
<div class="btns">
<button class="btn p" id="share">Özeti paylaş / kopyala</button>
<button class="btn" id="print">PDF / Yazdır</button>
</div>
</div>

<div class="card noprint">
<h2>Kayıtlı hesaplar</h2>
<div class="sv"><input type="text" id="sname" placeholder="Proje adı"><button class="btn p" id="save">Kaydet</button></div>
<div id="saved"></div>
</div>

<div class="card noprint">
<div class="row" id="sethead" style="cursor:pointer;padding:0"><label style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)">Ayarlar<small>Çaplar, takoz ve ayırıcı ölçüleri, kenar boşluğu</small></label><b id="setarr">▾</b></div>
<div id="setpanel" hidden>
<div id="diam"></div>
<div class="row"><label>Takoz (kablo arası)</label><input id="b1" type="number" step="0.1" value="7"></div>
<div class="row"><label>Devre ayırıcı</label><input id="b2" type="number" step="0.1" value="14"></div>
<div class="row"><label>Abone başına genişlik (cm)<small>her abone genişliğe eklenir</small></label><input id="abw" type="number" step="1" value="10"></div>
<div class="row"><label>Kanal derinliği (cm)<small>çift katlı kanalda gösterilir</small></label><input id="dp" type="number" step="1" value="130"></div>
<div class="row"><label>Kenar boşluğu<small>her yan için</small></label><input id="mg" type="number" step="0.1" value="0"></div>
</div>
</div>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const v=id=>Math.max(0,parseFloat($(id).value)||0);
const f=n=>(Math.round(n*100)/100).toString().replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT=[
{id:'x150',n:'1x150 XLPE kablo',d:5,c:1},
{id:'x240',n:'1x240 XLPE kablo',d:5,c:1},
{id:'x400',n:'1x400 XLPE kablo',d:5,c:1},
{id:'k240',n:'3x240 kablo',d:5,c:0},
{id:'k16',n:'4x16 kablo',d:5,c:0}];
let cnt={x150:1,k240:3,k16:2},pname='';
const OK='kanal-ozel',OR='kanal-sira';
const KEY='kanal-kayitlar',DK='kanal-ayarlar2';
function ld(k,def){try{const r=localStorage.getItem(k);return r?JSON.parse(r):def}catch(e){return def}}
function sv(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}

const kn=n=>/kablo\s*$/i.test(n)?n:n+' kablo';
ld(OK,[]).forEach(o=>CAT.push({id:o.id,n:kn(o.n),d:o.d,c:o.c,cu:1}));
let ord=ld(OR,[]).filter(id=>CAT.some(c=>c.id===id));CAT.forEach(c=>{if(!ord.includes(c.id))ord.push(c.id)});
const OL=()=>ord.map(id=>CAT.find(c=>c.id===id)).filter(Boolean);
// çaplar
const dset=ld(DK,{});CAT.forEach(c=>{if(typeof dset[c.id]==='number')c.d=dset[c.id]});
const rowH=c=>'<div class="row"><label>'+esc(c.n)+'<small>'+(c.c?'devre sayısı (1 devre = 3 kablo)':'kablo adedi')+' · çap <span data-cd="'+c.id+'">'+f(c.d)+'</span> cm</small></label><div class="step"><button data-id="'+c.id+'" data-s="-1">−</button><input type="number" data-n="'+c.id+'" value="0" min="0"><button data-id="'+c.id+'" data-s="1">+</button></div>'+(c.cu?'<button class="x" data-del="'+c.id+'" title="Kabloyu sil">×</button>':'')+'</div>';
function renderAll(){
  $('diam').innerHTML=CAT.map(c=>'<div class="row"><label>'+esc(c.n)+' çapı</label><input type="number" step="0.1" data-d="'+c.id+'" value="'+c.d+'"></div>').join('');
  $('cables').innerHTML=CAT.map(rowH).join('')+'<div class="row"><label>Abone sayısı<small>her abone genişliğe '+f(v('abw'))+' cm ekler</small></label><div class="step"><button data-id="abone" data-s="-1">−</button><input type="number" data-n="abone" value="0" min="0"><button data-id="abone" data-s="1">+</button></div></div>';
  setInputs();calc();
}
function setInputs(){const ea=document.querySelector('[data-n="abone"]');if(ea)ea.value=cnt.abone||0;CAT.forEach(c=>{const e=document.querySelector('[data-n="'+c.id+'"]');if(e)e.value=cnt[c.id]||0})}
function renderOrd(){
  const vis=OL().filter(c=>cnt[c.id]>0);
  $('ordsum').textContent=vis.length?vis.map(c=>c.n).join(' → '):'Önce kablo seç';
  $('ordpanel').innerHTML=vis.map((c,i)=>'<div class="row"><label>'+(i+1)+'. '+esc(c.n)+'</label><div class="step"><button data-mv="'+c.id+'" data-dir="-1">↑</button><button data-mv="'+c.id+'" data-dir="1">↓</button></div></div>').join('');
}

let R=null;
function lay(cs,b1,b2){const N=cs.length,parts=N?[{t:'s',w:b1}]:[];let S=0;cs.forEach((x,i)=>{parts.push(x);const sep=x.last&&i<N-1;if(sep)S++;parts.push({t:sep?'g':'s',w:sep?b2:b1})});const cab=cs.reduce((a,c)=>a+c.w,0),brk=parts.filter(p=>!p.c).reduce((a,p)=>a+p.w,0);return{cs,parts,N,S,n7:parts.filter(p=>p.t==='s').length,cab,brk,w:cab+brk}}
function calc(){
  renderOrd();
  const b1=v('b1'),b2=v('b2'),mg=v('mg'),cs=[];
  OL().forEach(c=>{
    const n=Math.floor(cnt[c.id]||0);
    if(c.c)for(let i=0;i<n*3;i++)cs.push({c,w:c.d,last:i%3===2});
    else for(let i=0;i<n;i++)cs.push({c,w:c.d,last:false});
  });
  const N=cs.length;
  if(!N){R=null;['total','sum','rN','rC','rB','rM','seq','rLv'].forEach(i=>$(i).textContent='');$('total').textContent='–';$('bar').innerHTML='';$('rBl').textContent='Takoz + ayırıcı';return}
  const abn=Math.floor(cnt.abone||0),abW=abn*v('abw'),two=$('kat').value==='2';
  const grp=two?[{n:'Alt kat (OG)',cs:cs.filter(x=>x.c.c)},{n:'Üst kat (AG)',cs:cs.filter(x=>!x.c.c)}].filter(g=>g.cs.length||(g.n[0]==='Ü'&&abn)):[{n:'',cs}];
  const lv=grp.map(g=>{const o=lay(g.cs,b1,b2),ab=(!two||g.n[0]==='Ü')?abW:0;return{n:g.n,...o,ab,w:o.w+ab}});
  const sm=k=>lv.reduce((a,l)=>a+l[k],0),cab=sm('cab'),brk=sm('brk'),n7=sm('n7'),S=sm('S'),W=Math.max(...lv.map(l=>l.w)),tot=W+2*mg;
  R={cs,lv,N,S,n7,cab,brk,mg,tot,b1,b2,abn,abW};
  const multi=lv.length>1;
  $('total').textContent=f(tot)+' cm';
  $('sum').textContent=multi?lv.map(l=>l.n+' '+f(l.w)).join(' · ')+(mg?' + '+f(2*mg):'')+' cm (geniş olan esas)':f(cab)+' + '+f(brk)+(abW?' + '+f(abW):'')+(mg?' + '+f(2*mg):'')+' cm';
  $('rN').textContent=N;$('rC').textContent=f(cab)+' cm';
  $('rBl').textContent='Takoz + ayırıcı ('+n7+'×'+f(b1)+' + '+S+'×'+f(b2)+')';
  $('rB').textContent=f(brk)+' cm';$('rM').textContent=f(2*mg)+' cm';
  const abL=abn?'<div class="line"><span>Abone ('+abn+' × '+f(v('abw'))+' cm)</span><b>'+f(abW)+' cm</b></div>':'';
  $('rLv').innerHTML=(multi?lv.map(l=>'<div class="line"><span>'+l.n+'</span><b>'+f(l.cab)+' + '+f(l.brk)+(l.ab?' + '+f(l.ab):'')+' = '+f(l.w)+' cm</b></div>').join(''):'')+abL+(multi?'<div class="line"><span>Kanal derinliği</span><b>'+f(v('dp'))+' cm</b></div>':'');
  const col=p=>p.c?(p.c.c?'--cx':'--cm'):(p.t==='g'?'--b14':'--b7');
  $('bar').innerHTML=lv.slice().reverse().map(l=>(multi?'<div class="lvl">'+l.n+' · '+f(l.w)+' cm</div>':'')+'<div class="bar" style="width:'+(l.w/W*100)+'%">'+l.parts.map(p=>'<div style="flex:'+p.w+' 0 0;background:var('+col(p)+')"></div>').join('')+(l.ab?'<div style="flex:'+l.ab+' 0 0;background:var(--ac)"></div>':'')+'</div>').join('');
  $('seq').textContent=lv.slice().reverse().map(l=>(multi?l.n+': ':'')+l.parts.map(p=>p.c?p.c.n:f(p.w)).join(' | ')+(l.ab?' | Abone ('+abn+'×'+f(v('abw'))+')':'')).join('\n');
}
function summary(){
  if(!R)return '';
  let t='Kablo Kanalı Hesabı'+(pname?' - '+pname:'')+'\n';
  OL().forEach(c=>{const n=cnt[c.id]||0;if(n)t+='• '+c.n+': '+n+(c.c?' devre':' adet')+'\n'});
  t+='\nKanal genişliği: '+f(R.tot)+' cm\n';
  if(R.abn)t+='Abone: '+R.abn+' adet × '+f(v('abw'))+' cm = '+f(R.abW)+' cm\n';
  if(R.lv.length>1){R.lv.forEach(l=>{t+=l.n+': kablo '+f(l.cab)+' + takoz/ayırıcı '+f(l.brk)+(l.ab?' + abone '+f(l.ab):'')+' = '+f(l.w)+' cm\n'});t+='Kanal derinliği: '+f(v('dp'))+' cm\n'}
  else t+='Kablo: '+f(R.cab)+' cm\nTakoz + ayırıcı: '+f(R.brk)+' cm ('+R.n7+'×'+f(R.b1)+' + '+R.S+'×'+f(R.b2)+')\n';
  if(R.mg)t+='Kenar boşluğu: '+f(2*R.mg)+' cm\n';
  return t;
}
function renderSaved(){
  const a=ld(KEY,[]);
  $('saved').innerHTML=a.length?a.map((s,i)=>'<div class="item"><span>'+esc(s.name)+'<small>'+esc(s.info||'')+'</small></span><button data-o="'+i+'">Aç</button><button data-x="'+i+'">Sil</button></div>').join(''):'<div class="empty">Henüz kayıt yok.</div>';
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#sethead')){const q=$('setpanel');q.hidden=!q.hidden;$('setarr').textContent=q.hidden?'▾':'▴'}
  if(t.closest('#ordhead')){const q=$('ordpanel');q.hidden=!q.hidden;$('ordarr').textContent=q.hidden?'▾':'▴'}
  if(t.closest('#addhead')){const q=$('addpanel');q.hidden=!q.hidden;$('addarr').textContent=q.hidden?'▾':'▴'}
  if(t.dataset.mv){const id=t.dataset.mv,dir=parseInt(t.dataset.dir),vis=OL().filter(c=>cnt[c.id]>0).map(c=>c.id),k=vis.indexOf(id),j=k+dir;if(j>=0&&j<vis.length){const a=ord.indexOf(vis[k]),b=ord.indexOf(vis[j]);[ord[a],ord[b]]=[ord[b],ord[a]];sv(OR,ord);calc()}}
  if(t.dataset.del){const id=t.dataset.del;sv(OK,ld(OK,[]).filter(o=>o.id!==id));const i=CAT.findIndex(c=>c.id===id);if(i>=0)CAT.splice(i,1);ord=ord.filter(x=>x!==id);sv(OR,ord);delete cnt[id];renderAll();toast('Kablo silindi')}
  if(t.dataset.s){const id=t.dataset.id;cnt[id]=Math.max(0,(cnt[id]||0)+parseInt(t.dataset.s));setInputs();calc()}
  if(t.dataset.o!==undefined){const s=ld(KEY,[])[t.dataset.o];if(s){cnt=s.cnt||{};$('kat').value=s.kat||'1';if(s.ord){const o=s.ord.filter(id=>CAT.some(c=>c.id===id));CAT.forEach(c=>{if(!o.includes(c.id))o.push(c.id)});ord=o;sv(OR,ord)}$('mg').value=s.mg;pname=s.name;$('sname').value=s.name;$('pname').textContent=s.name;setInputs();calc();window.scrollTo(0,0)}}
  if(t.dataset.x!==undefined){const a=ld(KEY,[]);a.splice(t.dataset.x,1);sv(KEY,a);renderSaved()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.n){cnt[t.dataset.n]=Math.max(0,parseInt(t.value)||0)}
  if(t.dataset.d){const c=CAT.find(x=>x.id===t.dataset.d);c.d=v_(t);const o={};CAT.forEach(x=>o[x.id]=x.d);sv(DK,o);document.querySelector('[data-cd="'+c.id+'"]').textContent=f(c.d)}
  if(t.type==='number')calc();
});
function v_(el){return Math.max(0,parseFloat(el.value)||0)}
$('save').onclick=()=>{
  if(!R){toast('Önce kablo ekle');return}
  const name=$('sname').value.trim()||('Hesap '+new Date().toLocaleDateString('tr-TR'));
  const a=ld(KEY,[]);
  a.unshift({name,kat:$('kat').value,cnt:{...cnt},ord:[...ord],mg:v('mg'),info:f(R.tot)+' cm · '+R.N+' kablo'});
  sv(KEY,a);pname=name;$('pname').textContent=name;renderSaved();toast('Kaydedildi');
};
$('share').onclick=async()=>{
  const t=summary();if(!t){toast('Önce kablo ekle');return}
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Kopyalandı')}catch(e){prompt('Kopyala:',t)}
};
$('print').onclick=()=>window.print();
$('kat').onchange=calc;
$('cadd').onclick=()=>{
  const n=$('cn').value.trim(),d=parseFloat(String($('cd').value).replace(',','.'));
  if(!n||!(d>0)){toast('Ad ve çap gir');return}
  const o={id:'u'+Date.now(),n,d,c:$('ct').value==='1'?1:0};
  const a=ld(OK,[]);a.push(o);sv(OK,a);CAT.push({...o,n:kn(o.n),cu:1});ord.push(o.id);sv(OR,ord);
